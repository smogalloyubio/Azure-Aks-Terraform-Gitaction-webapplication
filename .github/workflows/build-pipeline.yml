name: DevSecOps Pipeline for Car Web Application

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-pipeline.yaml"
      - "Dockerfile"
      - "src/**"

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  gitleaks:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Scan
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/repo \
            ghcr.io/gitleaks/gitleaks:latest detect \
            --source="/repo" \
            --redact \
            --report-format sarif \
            --report-path /repo/gitleaks.sarif

      - name: Upload SARIF Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif

  code-lint-and-test:
    name: Code Linting & Unit Tests
    needs: checkov-kubernetes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint --if-present

      - name: Run Unit Tests
        run: npm test -- --passWithNoTests

  sast-and-trivy-fs:
    name: Code SAST & Filesystem Security Scan
    needs: code-lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: p/javascript

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: 0

  checkov-terraform:
    name: Terraform Security Scan
    needs: gitleaks
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull Checkov Docker Image
        run: docker pull bridgecrew/checkov:latest

      - name: Create Directory for Reports
        run: mkdir -p reports

      - name: Run Terraform Checkov Scan
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/repo \
            -w /repo \
            bridgecrew/checkov:latest \
            --directory /repo/terraform-aks \
            --framework terraform \
            --output sarif \
            --output-file-path reports \
            --soft-fail

      - name: Upload SARIF Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/results_sarif.sarif

      - name: Upload Terraform Report
        uses: actions/upload-artifact@v4
        with:
          name: terraform-checkov-report
          path: reports/results_sarif.sarif

  checkov-dockerfile:
    name: Dockerfile Security Scan
    needs: gitleaks
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull Checkov Docker Image
        run: docker pull bridgecrew/checkov:latest

      - name: Run Dockerfile Checkov Scan
        run: |
          mkdir -p reports
          docker run --rm \
            -v ${{ github.workspace }}:/repo \
            -w /repo \
            bridgecrew/checkov:latest \
            --directory /repo \
            --framework dockerfile \
            --output sarif \
            --output-file-path reports \
            --soft-fail

      - name: Upload SARIF Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/results_sarif.sarif

      - name: Upload Docker Report
        uses: actions/upload-artifact@v4
        with:
          name: docker-checkov-report
          path: reports/results_sarif.sarif

  checkov-kubernetes:
    name: Kubernetes Security Scan
    needs: gitleaks
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull Checkov Docker Image
        run: docker pull bridgecrew/checkov:latest

      - name: Run Kubernetes Checkov Scan
        run: |
          mkdir -p reports
          docker run --rm \
            -v ${{ github.workspace }}:/repo \
            -w /repo \
            bridgecrew/checkov:latest \
            --directory /repo/k8s-manifest \
            --framework kubernetes \
            --output sarif \
            --output-file-path reports \
            --soft-fail

      - name: Upload SARIF Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/results_sarif.sarif

      - name: Upload Kubernetes Report
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-checkov-report
          path: reports/results_sarif.
  
  sonarqube:
    name: SonarQube SAST Scan
    runs-on: ubuntu-latest
    needs: [code-lint-and-test, sast-and-trivy-fs]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  

      - name: Cache SonarQube Packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Run SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  build-and-push-dockerhub:
    name: Build, Scan & Push to Azure Container Registry (ACR)
    runs-on: ubuntu-latest
    needs: sonarqube  
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: azure login 
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS}}

      - name: Log in to Azure Container Registry (ACR)
        uses: docker/login-action@v3
        with:
          registry: nimbusacrj9tt6o.azurecr.io
          username: ${{ secrets.ACR_USERNAME}}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image Locally
        run: |
          IMAGE_TAG="rukevweubio/carshowroom-app:${{ github.sha }}"
          docker build --no-cache -t $IMAGE_TAG .

      - name: Run Trivy Image Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'rukevweubio/carshowroom-app:${{ github.sha }}'
          scan-type: 'image'
          severity: 'HIGH,CRITICAL'
          exit-code: 1

      - name: Install Syft CLI
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate Software Bill of Materials (SBOM)
        run: |
          syft dir:. -o spdx-json > sbom.json


      - name: Upload SBOM Artifact to GitHub UI
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx-json
          path: sbom.json


      - name: Push Container Image to ACR
        run: |
          docker push rukevweubio/carshowroom-app:${{ github.sha }}
          docker tag rukevweubio/carshowroom-app:${{ github.sha }} nimbusacrj9tt6o.azurecr.io/carshowroom-app:latest
          docker push rukevweubio/carshowroom-app:latest


      - name: Install Cosign CLI
        uses: sigstore/cosign-installer@v3.7.0


      - name: Sign Container Image Keylessly
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes rukevweubio/carshowroom-app:${{ github.sha }}

  
      - name: Attach Signed SBOM Attestation
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign attest --yes \
            --predicate sbom.json \
            --type spdxjson \
            rukevweubio/carshowroom-app:${{ github.sha }}

      - name: Verify Image Signature
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            rukevweubio/carshowroom-app:${{ github.sha }} > cosign-verification.json


      - name: Verify SBOM Attestation
        run: |
          cosign verify-attestation \
            --type spdxjson \
            --certificate-identity-regexp "https://github.com/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            rukevweubio/carshowroom-app:${{ github.sha }} > cosign-attestation.json

      - name: Upload Security & Attestation Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-attestations
          path: |
            sbom.json
            cosign-verification.json
            cosign-attestation.json
          retention-days: 14
  




         
    